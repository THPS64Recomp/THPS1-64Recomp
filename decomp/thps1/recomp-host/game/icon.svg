<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="deck-clip-thps1">
      <rect x="184" y="36" width="144" height="440" rx="72" />
    </clipPath>

    <filter id="shadow-thps1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base (royal indigo-blue) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#172554" stroke="#1E3A8A" stroke-width="8" />

  <!-- Skateboard Group -->
  <g transform="rotate(-45 256 256)" filter="url(#shadow-thps1)">

    <!-- 1. DECK GRAPHIC -->
    <g clip-path="url(#deck-clip-thps1)">
      <!-- Blue-Grey Lower Base -->
      <rect x="184" y="36" width="144" height="440" fill="#475569" />
      
      <!-- Deep Navy Upper Diagonal Split -->
      <polygon points="184,36 328,36 328,230 184,280" fill="#0F172A" />
      
      <!-- Burnt-Orange Stringer & Tail Band -->
      <rect x="250" y="256" width="12" height="220" fill="#EA580C" />
      <rect x="184" y="348" width="144" height="12" fill="#0F172A" />

      <!-- 1 Diagonal Stripe Tally (Olive-Lime Scanline + Burnt Orange Border) -->
      <polygon points="184,262 328,212 328,246 184,296" fill="#EA580C" />
      <polygon points="184,270 328,220 328,238 184,288" fill="#84CC16" />

      <!-- Center Badge (Navy Core + Burnt Orange Ring + Silver Rim) -->
      <g transform="rotate(45 256 256)">
        <circle cx="256" cy="256" r="54" fill="#CBD5E1" stroke="#09090B" stroke-width="6" />
        <circle cx="256" cy="256" r="44" fill="#0F172A" stroke="#EA580C" stroke-width="8" />
        <!-- Golden-Yellow "1" -->
        <polygon points="246,224 266,224 266,274 278,274 278,288 234,288 234,274 246,274 246,242 232,250 232,235" fill="#FACC15" />
      </g>

      <!-- Exposed Maple Wood Inner Rim -->
      <rect x="192" y="44" width="128" height="424" rx="64" fill="none" stroke="#FDE68A" stroke-width="8" />
    </g>

    <!-- Deck Outer Border -->
    <rect x="184" y="36" width="144" height="440" rx="72" fill="none" stroke="#09090B" stroke-width="12" />

    <!-- 2. TOP TRUCK & WHEELS (Silver Hangers, Burnt-Orange Bushing, Lime Core) -->
    <g id="top-truck-thps1">
      <rect x="142" y="138" width="228" height="12" rx="6" fill="#94A3B8" stroke="#09090B" stroke-width="6" />
      <rect x="148" y="114" width="34" height="60" rx="12" fill="#F8FAFC" stroke="#09090B" stroke-width="8" />
      <line x1="165" y1="122" x2="165" y2="166" stroke="#84CC16" stroke-width="5" stroke-linecap="round" />
      <rect x="330" y="114" width="34" height="60" rx="12" fill="#F8FAFC" stroke="#09090B" stroke-width="8" />
      <line x1="347" y1="122" x2="347" y2="166" stroke="#84CC16" stroke-width="5" stroke-linecap="round" />
      <rect x="226" y="116" width="60" height="56" rx="8" fill="#334155" stroke="#09090B" stroke-width="6" />
      <polygon points="182,134 330,134 322,154 278,154 270,162 242,162 234,154 190,154" fill="#E2E8F0" stroke="#09090B" stroke-width="6" stroke-linejoin="round" />
      <circle cx="256" cy="132" r="9" fill="#EA580C" stroke="#09090B" stroke-width="4" />
      <circle cx="256" cy="146" r="8" fill="#64748B" stroke="#09090B" stroke-width="4" />
    </g>

    <!-- 3. BOTTOM TRUCK & WHEELS -->
    <g id="bottom-truck-thps1">
      <rect x="142" y="362" width="228" height="12" rx="6" fill="#94A3B8" stroke="#09090B" stroke-width="6" />
      <rect x="148" y="338" width="34" height="60" rx="12" fill="#F8FAFC" stroke="#09090B" stroke-width="8" />
      <line x1="165" y1="346" x2="165" y2="390" stroke="#84CC16" stroke-width="5" stroke-linecap="round" />
      <rect x="330" y="338" width="34" height="60" rx="12" fill="#F8FAFC" stroke="#09090B" stroke-width="8" />
      <line x1="347" y1="346" x2="347" y2="390" stroke="#84CC16" stroke-width="5" stroke-linecap="round" />
      <rect x="226" y="340" width="60" height="56" rx="8" fill="#334155" stroke="#09090B" stroke-width="6" />
      <polygon points="182,378 330,378 322,358 278,358 270,350 242,350 234,358 190,358" fill="#E2E8F0" stroke="#09090B" stroke-width="6" stroke-linejoin="round" />
      <circle cx="256" cy="380" r="9" fill="#EA580C" stroke="#09090B" stroke-width="4" />
      <circle cx="256" cy="366" r="8" fill="#64748B" stroke="#09090B" stroke-width="4" />
    </g>

  </g>
</svg>

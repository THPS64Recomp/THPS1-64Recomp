# The names the THPS1 host needs to know about, whatever the ROM version.
# tools/gen_versions.py gives every code class one entry per name in build/gen/thps_versions.h
# (struct thps::SymTable); a class that lacks a name FAILS THE BUILD. The host reads
# thps::sym().Name, never a literal address. Adding a version never edits host source: it
# supplies the addresses for these names (versions/<class>/).

# Function names forced onto the class's symbol file by decomp/common/gen_host_syms.py
# (hook targets, runtime-replaced libultra). Set equal to the [force] names of every class.
funcs = [
    "Boot_Entry", "Boot_Main", "Boot_PioCopy", "Erz_Unpack", "Erz_UnpackMethod2", "Erz_UnpackMethod1",
    "thps_osSetEventMesg", "thps_osPiRawStartDma", "thps_osAiGetStatus", "thps_osContGetQuery",
    "Cop2_MacReadback", "Cop2_RotLoad", "Pi_DmaThread", "GameEntry",
    "View_SetFrustum", "View_ComputeCullPlanes", "Front_NoticeUpdate", "Front_IntroUpdate", "NameEntry_Update",
    "CourseSelect_UpdateLock",
    "Music_LoadSong",         # (player, song): the music player copies the next song over the playing one (src/music.cpp)
]

# Addresses of game data (versions/<class>/data_syms.toml [addr]).
addr = [
    "gMsgLine0",              # notice message object: first text line pointer
    "gMsgState",              # nonzero while a notice message is up
    "gTextExpansionFound",    # "expansion pak found."
    "gTextExpansionNotFound", # "expansion pak not found."
    "gSControl",              # PlayStation-style pad layer: 20 SButton records of 16 bytes
    "gSkater",                # pointer to the skater object
    "gPhysicsFrameTime",      # logic step (1/30 s)
    "gTvType",                # game copy of osTvType
    "gNameEntryBuf",          # name entry screen: the 13 characters typed so far (tests)
    "gCourseTable",           # SELECT COURSE: 9 course records of 0x78 bytes (+0x10 locked word, +0x3C tapes needed, +0x40 medals needed)
    "gCareerSkaters",         # career: one 20-byte record per skater (+8 tapes, +0xC.. medal bits per competition course); what the save is made of
    "gCheatPerfectBalance",   # the game's own cheat flags (words, 1 = on; the cheat-code handler toggles them): rail balance
    "gCheatSlowMotion",       #   slow motion (the frame update halves the physics step)
    "gCheatSkipToRestart",    #   the pause menu's restart-point entry
    "gTimeScale",             # physics step (word, 256 = 1/30 s; set at the course start: 128 with slow motion)
    "gCourseCursor",          # SELECT COURSE: the course under the cursor (0..8, an index into gCourseTable)
    "gMusNumChannels",        # MUS library: number of channels (word)
    "gMusChannels",           # MUS library: pointer to the channel records (304 bytes each; src/music.cpp)
]

# Struct field offsets (versions/<class>/data_syms.toml [field]): layout can differ between builds.
field = [
    "View_Frustum",           # View: l, r, b, t, near, far floats (glFrustum arguments)
    "Skater_ControlPtr",      # Skater: pointer back to gSControl
    "Skater_PhysState",       # Skater: physics state word (1 = in air)
    "Skater_TrickCounters",   # Skater: per-trick counters
    "Skater_MagicPoints",     # Skater: special-meter points (mMagicPoints, toward 3000)
    "Course_Stride",          # gCourseTable: bytes per course record
    "Course_Locked",          # course record: word, nonzero = locked (the course select refuses A and shows what it needs)
    "Skater_RailBalance",     # Skater: rail balance (lean) word; 0 = centred; perfect balance holds it at 0 (DoOnRailPhysics)
    "Skater_MagicTime",       # Skater: special-meter time left (mMagicTime, 750 = full bar); the HUD meter draws from these two (tests/hud_special)
]

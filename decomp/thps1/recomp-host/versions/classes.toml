# Code classes: sets of recompiled functions (one generated payload each).
# Every ROM version in decomp/common/games.toml names its `code_class`; versions with the same
# code (v1.1 and the European release) share one. A class is generated from one ROM:
#   game   the games.toml row whose ROM the payload is built from (its codeblob is
#          decomp/thps1/build/<game>.codeblob.bin, from decomp/common/gen_syms.py --game <game>)
#   syms   N64Recomp symbol file (names, boundaries), relative to decomp/thps1
# Per-class host data lives in versions/<class>/{host_force.toml,data_syms.toml}.
# Docs: docs/internals/versions.md

[us11]
game = "thps1"
syms = "recomp/thps1.syms.toml"

[us10]
game = "thps1_us10"
syms = "recomp/thps1_us10.syms.toml"
